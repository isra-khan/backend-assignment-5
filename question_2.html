<html>
    <head>
        <title>Students</title>
    </head>
    <body>

        <script>
            let students = ['John', 'Jane', 'Jim', 'Jill', 'Jack'];

            students.push('Jerry');
            console.log(students);

            students.pop();
            console.log(students);

            students.unshift('Jasmine');
            console.log(students);

            students.shift();
            console.log(students);

            console.log(students.length);
        </script>

    </body>
</html>
